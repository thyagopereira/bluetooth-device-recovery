# The watchdog takes no action on an ordinary disconnect. It reacts only to the
# MT7925 controller failure signature observed on this computer.
[policy]
errors_before_recovery = 3
error_window_seconds = 45
cooldown_seconds = 120
trigger_patterns = ["start background scanning failed: -16"]

# Keep false to guarantee recovery touches registered devices only. Set true
# only if direct reconnects are insufficient and a short interruption to every
# Bluetooth device is acceptable.
allow_adapter_reset = false
adapter_reset_path = "/sys/class/bluetooth/hci0/reset"

[[device]]
name = "BT5.0 KB"
address = "AA:BB:CC:DD:EE:FF"
enabled = true

# Register other devices by adding another [[device]] block. For example:
#
# [[device]]
# name = "Logitech M720 Triathlon"
# address = "11:22:33:44:55:66"
# enabled = true
