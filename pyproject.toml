[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetooth-device-recovery"
version = "0.1.0"
description = "Targeted Bluetooth device recovery for Linux"
requires-python = ">=3.11"

[project.scripts]
bt-device-recovery = "bluetooth_recovery.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
